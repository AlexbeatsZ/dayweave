[package]
name = "work-review-agent"
version = "0.2.0"
edition = "2021"

[dependencies]
work-review-core = { path = "../core" }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }
log = "0.4"
env_logger = "0.11"
once_cell = "1"
regex = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "0.30", features = ["bundled"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows-capture = "1.5"
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "tlhelp32", "psapi", "handleapi", "winnt", "winbase", "sysinfoapi", "wingdi", "libloaderapi", "shellapi", "commctrl", "commoncontrols"] }
uiautomation = "0.24"

[target.'cfg(target_os = "macos")'.dependencies]
screenshots = "0.8"
cocoa = "0.25"
objc = "0.2"
block = "0.1.6"
core-graphics = "0.23"
core-foundation = "0.9"

[features]
cargo-clippy = []

[dev-dependencies]
tempfile = "3"
