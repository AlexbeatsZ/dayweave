[package]
name = "work-review-core"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.30", features = ["bundled"] }
regex = "1"
once_cell = "1"
log = "0.4"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
url = "2"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
