# Public ICS and existing REALITY share TCP443; no TLS termination on the REALITY path.
global
    user haproxy
    group haproxy
    maxconn 2048

defaults
    mode tcp
    timeout connect 10s
    timeout client 60s
    timeout server 60s

resolvers system_dns
    nameserver vultr_primary 108.61.10.10:53
    nameserver vultr_secondary 108.61.115.10:53
    hold valid 30s

frontend public_443
    bind 0.0.0.0:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend owner_reality if { req.ssl_sni -i www.cloudflare.com }
    default_backend calendar_tls

backend owner_reality
    server existing_owner 127.0.0.1:7443

backend calendar_tls
    server local_tls 127.0.0.1:8443

frontend calendar_https
    bind 127.0.0.1:8443 ssl crt /opt/dayweave-ics443/tls/calendar.pem ssl-min-ver TLSv1.2 alpn http/1.1
    mode http
    acl allowed_method method GET HEAD
    acl calendar_path path_reg ^/dayweave/calendar/[0-9a-f]{64}\.ics$
    acl has_query query -m found
    http-request deny deny_status 404 unless allowed_method calendar_path
    http-request deny deny_status 404 if has_query
    http-request set-header Host cdn.u3146344.nyat.app:63573
    default_backend original_calendar

backend original_calendar
    mode http
    server rog cdn.u3146344.nyat.app:63573 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt verifyhost cdn.u3146344.nyat.app sni str(cdn.u3146344.nyat.app) resolvers system_dns init-addr libc,none
