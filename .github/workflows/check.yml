name: Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path native/collector/Cargo.toml --workspace
      - run: npm run build:collector
      - run: node scripts/smoke-collector.mjs
      - run: node --import tsx --test tests/sync.test.ts tests/sync-recovery.test.ts tests/personal-goal-scripts.test.ts
      - run: npm run dist:win
      - run: npm run test:portable
      - uses: actions/upload-artifact@v4
        with:
          name: Dayweave-Windows-x64
          path: |
            release/Dayweave-*-Windows-x64.exe
            release/Dayweave-*-Windows-Setup.exe
