name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run bundle:ai
      - run: npm run test:headless
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: node scripts/smoke-tray.mjs
      - run: node scripts/smoke-desktop.mjs
      - run: node scripts/smoke-api.mjs
      - run: node scripts/smoke-fudan.mjs
      - run: npm run dist:win
      - run: npm run test:portable
      - uses: actions/upload-artifact@v4
        with:
          name: Dayweave-Windows-x64
          path: release/Dayweave-*-Windows-x64.exe
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:sync
      - run: node scripts/package-android.mjs --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: Dayweave-Android-unsigned
          path: release/Dayweave-*-Android-unsigned.apk
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            app-dir: mac-arm64
          - runner: macos-15-intel
            arch: x64
            app-dir: mac
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke-desktop.mjs
      - run: node scripts/smoke-tray.mjs
      - run: node scripts/smoke-api.mjs
      - run: node scripts/package-macos.mjs ${{ matrix.arch }}
      - run: node scripts/smoke-api.mjs
        env:
          DAYWEAVE_EXECUTABLE: release/${{ matrix.app-dir }}/Dayweave.app/Contents/MacOS/Dayweave
      - uses: actions/upload-artifact@v4
        with:
          name: Dayweave-macOS-${{ matrix.arch }}
          path: |
            release/Dayweave-*-macOS-${{ matrix.arch }}.dmg
            release/Dayweave-*-macOS-${{ matrix.arch }}.zip
