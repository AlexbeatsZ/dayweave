name: Check
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  windows-release-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Dayweave-Windows-x64
          run-id: 44888667313
          github-token: ${{ github.token }}
          path: dist
      - run: gh release upload v0.5.16 dist/Dayweave-0.5.16-Windows-Setup.exe
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
