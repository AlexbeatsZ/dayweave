name: Check
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac-app-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5.16
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - run: npm run build:collector
      - run: node -e "require('electron')"
      - run: npm run dist:mac
      - run: node scripts/smoke-api.mjs
        env:
          DAYWEAVE_EXECUTABLE: release/mac-arm64/Dayweave.app/Contents/MacOS/Dayweave
      - run: |
          if ! gh release view v0.5.16 --json assets --jq '.assets[].name' | grep -Fxq 'Dayweave-0.5.16-macOS-arm64.dmg'; then
            gh release upload v0.5.16 release/Dayweave-0.5.16-macOS-arm64.dmg
          fi
        env:
          GH_TOKEN: ${{ github.token }}
